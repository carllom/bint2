name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; queue new ones instead of cancelling
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit -- run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for e2e
        run: npm run build-only

      - name: Run e2e tests
        run: npm run test:e2e -- --project=chromium

      - name: Build for production
        # Base path matches this repo's name, so the site resolves correctly
        # at the default project-page URL (<owner>.github.io/<repo>/).
        # Change or drop --base if deploying to a custom domain or user/org page.
        run: npm run build-only -- --base=/${{ github.event.repository.name }}/

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
