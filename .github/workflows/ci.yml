name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit -- run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The e2e suite runs against the production build; the Playwright
      # webServer builds it and serves `vite preview`. CI gates on chromium
      # only — the firefox and webkit projects are for local cross-engine
      # spot-checks and webkit is allowed to fail (see playwright.config.ts).
      - name: Run e2e tests
        run: npm run test:e2e -- --project=chromium
